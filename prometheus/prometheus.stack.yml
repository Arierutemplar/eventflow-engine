global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "api-gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:4004"]

  - job_name: "event-workers"
    metrics_path: /metrics
    static_configs:
      - targets: ["event-workers:4001"]

  - job_name: "event-consumer"
    metrics_path: /metrics
    static_configs:
      - targets: ["event-consumer:4002"]

  - job_name: "notification-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["notification-service:4003"]

  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]
