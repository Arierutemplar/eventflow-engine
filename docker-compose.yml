version: '3.8'

services:
  # Base de Datos Relacional Principal
  postgres:
    image: postgres:16-alpine
    container_name: eventflow_postgres
    restart: always
    environment:
      POSTGRES_USER: eventuser
      POSTGRES_PASSWORD: eventpassword
      POSTGRES_DB: eventflow_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventuser -d eventflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # In-Memory Cache, Rate Limiting y Bloqueos Distribuidos
  redis:
    image: redis:7-alpine
    container_name: eventflow_redis
    restart: always
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Message Broker con Interfaz Web de Gestión
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: eventflow_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '5672:5672'   # AMQP Protocol
      - '15672:15672' # Management Dashboard
      - '15692:15692' # Prometheus metrics
    command: >-
      sh -c "rabbitmq-plugins enable --offline rabbitmq_prometheus &&
      rabbitmq-server"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Monitorización de Métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: eventflow_prometheus
    restart: always
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts:/etc/prometheus/alerts
      - prometheus_data:/prometheus

  # Gestión de alertas de Prometheus
  alertmanager:
    image: prom/alertmanager:latest
    container_name: eventflow_alertmanager
    restart: always
    ports:
      - '9093:9093'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager

  # Dashboard Visualizador de Infraestructura
  grafana:
    image: grafana/grafana:latest
    container_name: eventflow_grafana
    restart: always
    ports:
      - '3001:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  alertmanager_data: